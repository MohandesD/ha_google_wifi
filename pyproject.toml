[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.coverage.run]
branch = true
source = ["custom_components/google_wifi_insights"]

[tool.coverage.report]
show_missing = true
precision = 2

[tool.coverage.paths]
integration = ["custom_components/google_wifi_insights", "*/custom_components/google_wifi_insights"]
