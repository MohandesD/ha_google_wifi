name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - name: Install isolated test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Validate bundled HACS assets
        run: python tools/sync_frontend.py --check
      - name: Test integration and HA framework behaviour
        run: python -m pytest -q
      - name: Test map, history and bundled panel
        run: npm test
      - name: Build manual installation archive
        run: python tools/build_package.py
