google_action:
  name: Google WiFi action
  description: Run an explicit Google operation. Accepted requests may still be pending or fail; check the last operation sensor. Tests can temporarily affect throughput. Advanced actions require an administrator and exact network-name confirmation.
  fields:
    entity_id:
      required: true
      selector:
        entity:
          integration: google_wifi_insights
    action:
      required: true
      selector:
        select:
          options:
            - restart_network
            - restart_point
            - test_internet
            - test_mesh
            - test_local
            - test_clients
            - pause_client
            - resume_client
            - prioritize_client
            - clear_priority
            - set_point_light
            - pause_group
            - resume_group
            - create_device_group
            - update_device_group
            - delete_device_group
            - dismiss_insight
            - run_insight_action
            - remove_point
            - remove_network
    parameters:
      description: Optional typed parameters (duration_minutes, brightness, automatic, group_id, station_ids, name, card_id). Advanced actions need confirmation equal to the network name; removal additionally needs confirm_removal equal to the target name.
      selector:
        object:
get_usage_history:
  name: Get Google usage history
  description: Return cached per-minute (1h), per-hour (24h), per-day (7d) or per-day (30d) byte buckets, their period and collection time. Missing data is not zero. Network targets return WAN usage; client targets return that client only.
  fields:
    entity_id:
      required: true
      selector:
        entity:
          integration: google_wifi_insights
    resolution:
      required: true
      default: hour
      selector:
        select:
          options: [minute, hour, day, month]
get_capabilities:
  name: Get Google capabilities
  description: Return read availability, known action support, unverified capabilities and recent operation states without credentials.
  fields:
    entity_id:
      required: true
      selector:
        entity:
          integration: google_wifi_insights
get_google_metrics:
  name: Get all collected Google metrics
  description: Return collected metadata and saved test results. Credentials and opaque mesh configuration are excluded. Use get_usage_history for byte buckets.
  fields:
    entity_id:
      required: true
      selector:
        entity:
          integration: google_wifi_insights
get_management:
  name: Get network management
  description: Return cached point/area mappings, HA areas, exact MAC name suggestions, naming settings and private name-change history. No Google requests are made. Cached management is readable during outages so automatic naming can be disabled.
  fields:
    entity_id:
      required: true
      selector:
        entity:
          integration: google_wifi_insights
set_point_area:
  name: Map point to area
  description: Map a current Google WiFi point to an existing HA area. Updates WiFi associated area sensors, unassigned point device areas and opted-in client device areas. Clear area_id to remove the mapping.
  fields:
    entity_id:
      required: true
      selector:
        entity:
          integration: google_wifi_insights
    area_id:
      required: true
      selector:
        area:
set_client_area_sync:
  name: Set client device area following
  description: Enable local HA device area updates for connected wireless clients in one network. Devices follow the mapped point area. Unmapped, disconnected, wired or unavailable devices keep their last area. Disabled by default. Optionally include other HA devices identified by exact MAC. Disabling retains the last area; it does not restore earlier areas.
  fields:
    entity_id:
      required: true
      selector:
        entity:
          integration: google_wifi_insights
    enabled:
      required: true
      selector:
        boolean:
    include_matched_devices:
      default: false
      selector:
        boolean:
set_network_location:
  name: Set network location
  description: Save a home, building or location label in HA for a known cloud or local network. Equal labels group networks in the dashboard. Does not change Google homes, point identity, LAN access or HA device areas. Use null or an empty name to clear the label. Available during outages.
  fields:
    entity_id:
      required: true
      selector:
        entity:
          integration: google_wifi_insights
    name:
      required: true
      description: A printable location name with up to 64 characters. Null clears the location.
      selector:
        text:
set_name_sync:
  name: Set automatic Google naming
  description: Enable or disable automatic remediation of generic Google names for one network. Enabling requires an interactive administrator. Disabled by default; errors pause writes and uncertain requests are never retried automatically.
  fields:
    entity_id:
      required: true
      selector:
        entity:
          integration: google_wifi_insights
    enabled:
      required: true
      selector:
        boolean:
rename_client:
  name: Apply a proposed Google name
  description: Apply the current exact-MAC HA name to a generic Google client name. Requires an interactive administrator, the preview values and fresh identity validation. Saves intent before sending and verifies the resulting Google name.
  fields:
    entity_id:
      required: true
      selector:
        entity:
          integration: google_wifi_insights
    expected_google_name:
      required: true
      selector:
        text:
    expected_mac:
      required: true
      selector:
        text:
    expected_ha_name:
      required: true
      selector:
        text:
verify_name:
  name: Verify a name change
  description: Read Google again to verify a recorded name change. Does not send a rename or automatically repeat the original request.
  fields:
    entity_id:
      required: true
      selector:
        entity:
          integration: google_wifi_insights
    request_id:
      required: true
      selector:
        text:
undo_name:
  name: Undo a verified name change
  description: Restore a recorded name only if the current Google name and MAC still match the verified change. Requires an interactive administrator. The client is excluded from future automatic naming after an undo request.
  fields:
    entity_id:
      required: true
      selector:
        entity:
          integration: google_wifi_insights
    request_id:
      required: true
      selector:
        text:
