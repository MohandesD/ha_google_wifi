title: Google WiFi Network
views:
  - title: Network
    path: network
    icon: mdi:wifi
    cards:
      - type: markdown
        title: Available measurements
        content: >-
          Data is refreshed at the integration's configured polling interval. Google account mode reports
          clients and their associated points, subject to the data returned by the account.
          "Unknown" means that a measurement was not supplied.
          Client counts and traffic do not measure radio saturation.
          RSSI, when available, is only an indication of signal strength.
      - type: markdown
        title: WiFi points
        content: |-
          | Point | Status | Observed clients |
          |:---|:---|---:|
          {% for s in states.sensor if s.attributes.get('gwi_kind') == 'point' and s.attributes.get('gwi_metric') == 'clients' -%}
          | {{ s.attributes.device_name | replace('|', '/') | replace('\n', ' ') }} | {{ 'Unavailable' if s.state == 'unavailable' else ('Online' if s.attributes.get('online') == true else ('Offline' if s.attributes.get('online') == false else 'Unknown')) }} | {{ s.state if s.state not in ['unknown', 'unavailable'] else '—' }} |
          {% endfor -%}
      - type: markdown
        title: Connected devices
        content: |-
          | Device | Point | RSSI | Download / Upload |
          |:---|:---|---:|---:|
          {% set ns = namespace(found=false) -%}
          {% for s in states.sensor if s.attributes.get('gwi_kind') == 'client' and s.attributes.get('gwi_metric') == 'point' and s.attributes.get('connected') == true and s.state != 'unavailable' -%}
          {% set ns.found = true -%}
          | {{ s.attributes.device_name | replace('|', '/') | replace('\n', ' ') }} | {{ s.attributes.get('point') | default('Unknown', true) | replace('|', '/') | replace('\n', ' ') }} | {{ (s.attributes.rssi ~ ' dBm') if s.attributes.get('rssi') != none else '—' }} | {{ s.attributes.download_mbps if s.attributes.get('download_mbps') != none else '—' }} / {{ s.attributes.upload_mbps if s.attributes.get('upload_mbps') != none else '—' }} Mbps |
          {% endfor -%}
          {% if not ns.found %}
          No connected clients observed. The client list is unavailable in local mode. Unavailable sensors indicate that the latest query failed.
          {% endif %}
      - type: markdown
        title: Assessment and limitations
        content: |-
          {% for s in states.sensor if s.attributes.get('gwi_kind') == 'network' and s.attributes.get('gwi_metric') == 'diagnosis' %}
          **{{ s.attributes.device_name }}**: {% if s.state == 'point_offline' %}a point is reported offline.{% elif s.state == 'weak_signal_detected' %}at least one client has weak RSSI or a weak Google rating.{% elif s.state == 'unavailable' %}the query is unavailable; assessment is currently impossible.{% else %}radio metrics are missing, so saturation or the need to move points cannot be established.{% endif %}
          {% endfor %}

          Compare traffic and signal sensor history when evaluating point locations.
          A client with weak signal may indicate distance or obstacles, but signal
          alone does not identify congestion. Connectivity between points also
          needs to be assessed with the mesh test in the Google Home app.
